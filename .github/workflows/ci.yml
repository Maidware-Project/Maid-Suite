name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shell
        run: |
          # core entrypoints and key scripts (best-effort lint; keep non-fatal for legacy style)
          bash -n install.sh bin/maid-suite.sh bin/maid-suite-gui 2>/dev/null || true
          shellcheck -S error install.sh bin/maid-suite.sh bin/maid-suite-gui libexec/phone/*.sh 2>/dev/null || true
      - name: python
        run: |
          python3 -m compileall -q gui 2>/dev/null || true

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: eval flake package
        run: nix eval .#packages.x86_64-linux.default.name
